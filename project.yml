name: Abbay

options:
  defaultConfig: Release
  postGenCommand: Scripts/postinstall
  deploymentTarget:
    iOS: 17.0

configs:
  Debug: debug
  Release: release

settings:
  base:
    # Project
    SWIFT_VERSION: 5
    SDKROOT: iphoneos
    ENABLE_USER_SCRIPT_SANDBOXING: 'NO'
    SWIFT_EMIT_LOC_STRINGS: 'NO'
    LOCALIZED_STRING_SWIFTUI_SUPPORT: 'NO'
    PRODUCT_BUNDLE_IDENTIFIER: com.edyuto.$(PRODUCT_NAME)
    PRODUCT_NAME: $(TARGET_NAME)

    # Target
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    TARGET_DEVICE_FAMILY: '1'

    # Signing
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: iPhone Developer
    DEVELOPMENT_TEAM: 2X5PWXY74F
    PROVISIONING_PROFILE:
    PROVISIONING_PROFILE_SPECIFIER:
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG $(inherited)
      SWIFT_OPTIMIZATION_LEVEL: -Onone
      ENABLE_TESTABILITY: 'YES'
      ONLY_ACTIVE_ARCH: 'YES'
    Release:
      SWIFT_COMPILATION_MODE: wholemodule

targets:
  Abbay:
    type: application
    platform: iOS
    sources: [Abbay]
    postBuildScripts:
      - script: chmod +x ./Scripts/lint-checker
        name: Lint permissions
        basedOnDependencyAnalysis: 'NO'
      - script: ./Scripts/lint-checker
        name: SwiftLint
        basedOnDependencyAnalysis: 'NO'
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        INFOPLIST_FILE: Abbay/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Abbay/Resources/Abbay.entitlements
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @loader_path/Frameworks"
    dependencies:
      - sdk: AVFoundation.framework
      - sdk: CarPlay.framework

  AbbayTests:
    type: bundle.unit-test
    platform: iOS
    dependencies:
      - target: Abbay
    sources:
      - path: AbbayTests
        excludes:
          - "ReferenceImages/*"
          - "FailureDiffs/*"
    settings:
      base:
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: 'YES'
        BUNDLE_LOADER: $(TEST_HOST)
        GENERATE_INFOPLIST_FILE: 'YES'
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Abbay.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Abbay

schemes:
  Abbay:
    build:
      targets:
        Abbay: all
        AbbayTests: [test]
    test:
      gatherCoverageData: YES
      coverageTargets:
        - Abbay
      targets:
        - name: AbbayTests
          paralelizable: true
      environmentVariables:
        - variable: FB_REFERENCE_IMAGE_DIR
          value: $(SOURCE_ROOT)/$(PROJECT_NAME)Tests/ReferenceImages
          isEnabled: YES
        - variable: IMAGE_DIFF_DIR
          value: $(SOURCE_ROOT)/$(PROJECT_NAME)Tests/FailureDiffs
          isEnabled: YES
