name: Pull request main

on:
  pull_request:
    types:
      - edited
      - opened
      - synchronize
    branches:
      - 'main'

jobs:
  swiftlint:
    name: Swiftlint
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/realm/swiftlint:0.52.2
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Swiftlint
        run: |
          swiftlint --reporter github-actions-logging --strict

