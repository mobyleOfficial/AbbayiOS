name: Pull request main

on:
  pull_request:
    types:
      - edited
      - opened
      - synchronize
    branches:
      - 'main'

jobs:
  swiftlint:
    name: Swiftlint
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/realm/swiftlint:0.52.2
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Swiftlint
        run: |
          swiftlint --reporter github-actions-logging --strict

  test:
    name: Run tests
    runs-on: macos-13
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Generate project
        uses: xavierLowmiller/xcodegen-action@1.1.2
        with:
          spec: project.yml
          version: '2.32.0'

      - name: Setup Xcode version
        uses: maxim-lobanov/setup-xcode@v1.5.1
        with:
          xcode-version: '14.2'

      - name: Run tests
        run: |
          xcodebuild \
          -project Abbay.xcodeproj \
          -scheme Abbay \
          -sdk iphonesimulator \
          -destination 'platform=iOS Simulator,OS=15.0,name=iPhone 13' \
          test
