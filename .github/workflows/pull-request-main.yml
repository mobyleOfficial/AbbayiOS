name: Pull request main

on:
  pull_request:
    types:
      - edited
      - opened
      - synchronize
    branches:
      - 'main'

jobs:
  swiftlint:
    name: Swiftlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Swiftlint
        run: |
          set -o pipefail
          swiftlint
