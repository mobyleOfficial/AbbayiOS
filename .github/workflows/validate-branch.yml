name: Validate branch

on:
  pull_request:
    types:
      - opened
      - synchronize
    branches:
      - 'main'
      - 'develop'

jobs:
  load_settings:
    name: Load action settings
    runs-on: ubuntu-latest
    outputs:
      run_swiftlint: ${{ steps.get_settings.outputs.run_swiftlint }}
      run_tests: ${{ steps.get_settings.outputs.run_tests }}
      run_ui_tests: ${{ steps.get_settings.outputs.run_ui_tests }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read settings
        id: get_settings
        run: |
          CONFIG_FILE=".actions.yml"
          RUN_SWIFTLINT=$(grep 'run_swiftlint:' $CONFIG_FILE | awk '{print $2}')
          # `run_tests:` is not a substring of `run_ui_tests:`, so these two greps cannot
          # collide with each other.
          RUN_TESTS=$(grep 'run_tests:' $CONFIG_FILE | awk '{print $2}')
          RUN_UI_TESTS=$(grep 'run_ui_tests:' $CONFIG_FILE | awk '{print $2}')
          echo "run_swiftlint=${RUN_SWIFTLINT}" >> $GITHUB_OUTPUT
          echo "run_tests=${RUN_TESTS}" >> $GITHUB_OUTPUT
          echo "run_ui_tests=${RUN_UI_TESTS}" >> $GITHUB_OUTPUT

  swiftlint:
    name: Swiftlint
    needs: load_settings
    if: ${{ needs.load_settings.outputs.run_swiftlint == 'true' }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/realm/swiftlint:0.59.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Swiftlint
        run: |
          swiftlint --reporter github-actions-logging --strict

  test:
    name: Run tests
    needs: load_settings
    if: ${{ needs.load_settings.outputs.run_tests == 'true' }}
    permissions:
      checks: write
      contents: read
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode version
        uses: maxim-lobanov/setup-xcode@v1.5.1
        with:
          xcode-version: '26.4.1'

      - name: Run build
        run: |
          bundle install
          bundle exec fastlane test_project open:false

      - name: Zip test output
        if: success() || failure()
        run: |
          zip -r TestResults.zip TestResults.xcresult

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: TestResults.zip
          path: TestResults.zip

      - name: Test report
        uses: slidoapp/xcresulttool@v3.1.0
        if: success() || failure()
        with:
          path: TestResults.xcresult
          upload-bundles: never
          show-passed-tests: false
          show-code-coverage: true
          title: Test report

  ui_test:
    name: Run UI tests
    needs: load_settings
    if: ${{ needs.load_settings.outputs.run_ui_tests == 'true' }}
    permissions:
      checks: write
      contents: read
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode version
        uses: maxim-lobanov/setup-xcode@v1.5.1
        with:
          xcode-version: '26.4.1'

      - name: Run UI tests
        run: |
          bundle install
          bundle exec fastlane ui_test_project open:false

      - name: Zip UI test output
        if: success() || failure()
        run: |
          zip -r UITestResults.zip UITestResults.xcresult

      - name: Upload UI test results
        uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: UITestResults.zip
          path: UITestResults.zip

      - name: UI test report
        uses: slidoapp/xcresulttool@v3.1.0
        if: success() || failure()
        with:
          path: UITestResults.xcresult
          upload-bundles: never
          show-passed-tests: false
          title: UI test report
